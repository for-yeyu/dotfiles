# vim:ft=kitty

## name:     Sunset Bloom Kitty (Dark)
## author:   Lawliet
## blurb:    Warm orange-pink theme with teal accents

# The basic colors
foreground              #cdd6f4
background              #11111b
selection_foreground    #11111b
selection_background    #fab387

# Cursor colors
cursor                  #e6e9ef
cursor_text_color       #11111b

# Scrollbar colors
scrollbar_handle_color  #585b70
scrollbar_track_color   #313244

# URL color when hovering with mouse
url_color               #94e2d5

# Kitty window border colors
active_border_color     #f5c2e7
inactive_border_color   #f5c2e7
bell_border_color       #fab387

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #f5c2e7
inactive_tab_foreground #cdd6f4
inactive_tab_background #45475a
tab_bar_background      #313244

# Colors for marks (marked text in the terminal)
mark1_foreground #11111b
mark1_background #fab387
mark2_foreground #11111b
mark2_background #f38ba8
mark3_foreground #11111b
mark3_background #a6e3a1

