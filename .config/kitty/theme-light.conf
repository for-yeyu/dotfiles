# vim:ft=kitty

## name:     Sunset Bloom Kitty (Light)
## author:   Lawliet
## blurb:    Warm orange-pink theme with teal accents

# The basic colors
foreground              #2f3148
background              #dce0e8
selection_foreground    #eff1f5
selection_background    #d20f39

# Cursor colors
cursor                  #179299
cursor_text_color       #eff1f5

# Scrollbar colors
scrollbar_handle_color  #9ca0b0
scrollbar_track_color   #ccd0da

# URL color when hovering with mouse
url_color               #179299

# Kitty window border colors
active_border_color     #dd7878
inactive_border_color   #dd7878
bell_border_color       #fe640b

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #eff1f5
active_tab_background   #d20f39
inactive_tab_foreground #2f3148
inactive_tab_background #bcc0cc
tab_bar_background      #ccd0da

# Colors for marks (marked text in the terminal)
mark1_foreground #eff1f5
mark1_background #fe640b
mark2_foreground #eff1f5
mark2_background #d20f39
mark3_foreground #eff1f5
mark3_background #179299

