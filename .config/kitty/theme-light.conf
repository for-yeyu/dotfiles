# vim:ft=kitty

## name:     Tokyo Night Kitty (Dark)
## author:   Lawliet
## blurb:    Tokyo Night palette with blue, purple, and cyan accents

# The basic colors
foreground              #c0caf5
background              #1a1b26
selection_foreground    #c0caf5
selection_background    #33467c

# Cursor colors
cursor                  #c3f7f7
cursor_text_color       #1a1b26

# Scrollbar colors
scrollbar_handle_color  #3b4261
scrollbar_track_color   #24283b

# URL color when hovering with mouse
url_color               #7dcfff

# Kitty window border colors
active_border_color     #7aa2f7
inactive_border_color   #7aa2f7
bell_border_color       #e0af68

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #c0caf5
inactive_tab_background #292e42
tab_bar_background      #16161e

# Colors for marks (marked text in the terminal)
mark1_foreground #1a1b26
mark1_background #e0af68
mark2_foreground #1a1b26
mark2_background #f7768e
mark3_foreground #1a1b26
mark3_background #9ece6a

# The 16 terminal colors

# black
color0 #15161e
color8 #414868

# red
color1 #f7768e
color9 #f7768e

# green
color2  #9ece6a
color10 #9ece6a

# yellow
color3  #e0af68
color11 #e0af68

# blue
color4  #7aa2f7
color12 #7aa2f7

# magenta
color5  #bb9af7
color13 #bb9af7

# cyan
color6  #7dcfff
color14 #7dcfff

# white
color7  #a9b1d6
color15 #c0caf5
