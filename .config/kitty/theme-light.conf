# black
color0 #6c6f85
color8 #9ca0b0

# red
color1 #d20f39
color9 #d20f39

# green
color2  #40a02b
color10 #40a02b

# yellow
color3  #df8e1d
color11 #df8e1d

# blue
color4  #04a5e5
color12 #04a5e5

# magenta
color5  #8839ef
color13 #8839ef

# cyan
color6  #179299
color14 #179299

